[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/backend
autostart=true
autorestart=true
environment=UPLOAD_DIR="/data/uploads",RESULT_DIR="/data/results"
stdout_logfile=/tmp/api.log
stderr_logfile=/tmp/api.err

[program:nginx]
command=nginx -c /app/nginx.hf.conf
autostart=true
autorestart=true
stdout_logfile=/tmp/nginx.log
stderr_logfile=/tmp/nginx.err
depends_on=api
